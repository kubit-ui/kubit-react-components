name: Auto Publish Canary to NPM (Monorepo)

# This workflow automatically publishes canary versions on push to develop/next branches
# Canary versions follow the pattern: X.Y.Z-canary.SHA (e.g., 1.2.3-canary.abc1234)
#
# Use cases:
# - Quick testing of features before beta
# - Continuous deployment from develop branch
# - Preview releases for stakeholders
#
# Required secrets:
# 1. NPM_TOKEN: NPM automation token for publishing packages
# 2. RELEASE_TOKEN: GitHub PAT with bypass permissions (optional)

on:
  push:
    branches:
      - develop
      - next

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: read
  id-token: write # Required for NPM provenance

jobs:
  auto-publish-canary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Detect changed packages
        id: changes
        run: |
          echo "Detecting changes in packages compared to main..."

          # Fetch main branch for comparison
          git fetch origin main
          BASE_REF="origin/main"

          # Check for changes in each package
          DESIGN_SYSTEM_CHANGED=false
          COMPONENTS_CHANGED=false

          if git diff --name-only HEAD $BASE_REF | grep -q "^packages/design-system/"; then
            DESIGN_SYSTEM_CHANGED=true
            echo "✅ Changes detected in design-system"
          else
            echo "⏭️  No changes in design-system"
          fi

          if git diff --name-only HEAD $BASE_REF | grep -q "^packages/components/"; then
            COMPONENTS_CHANGED=true
            echo "✅ Changes detected in react-components"
          else
            echo "⏭️  No changes in react-components"
          fi

          echo "design_system_changed=$DESIGN_SYSTEM_CHANGED" >> $GITHUB_OUTPUT
          echo "components_changed=$COMPONENTS_CHANGED" >> $GITHUB_OUTPUT

          # If no changes, skip publish
          if [ "$DESIGN_SYSTEM_CHANGED" = "false" ] && [ "$COMPONENTS_CHANGED" = "false" ]; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "⏭️  No changes detected in publishable packages, skipping publish"
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          echo "Installing monorepo dependencies..."
          pnpm install --frozen-lockfile

      - name: Run quality checks
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          echo "Running quality checks with Turbo..."
          pnpm lint --filter=@kubit-ui-web/react-components --filter=@kubit-ui-web/design-system
          pnpm typecheck --filter=@kubit-ui-web/react-components --filter=@kubit-ui-web/design-system

      - name: Run tests
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          echo "Running tests with Turbo..."
          pnpm test

      - name: Build packages
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          echo "Building packages with Turbo..."
          pnpm build

      - name: Configure Git
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          git config --local user.email "kubit-bot@github.com"
          git config --local user.name "Kubit Release Bot"

      - name: Verify NPM authentication
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "❌ NPM_TOKEN not configured"
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Determine and publish canary versions
        if: steps.changes.outputs.should_publish == 'true'
        id: canary-publish
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Branch: $BRANCH_NAME"
          echo "Commit SHA: $SHORT_SHA"

          PUBLISHED=""
          HAS_PUBLISHED=false

          # Function to calculate canary version
          calc_canary_version() {
            local current=$1
            local sha=$2
            node -e "
              const current = '$current';
              const sha = '$sha';

              // Remove any pre-release suffix (beta, canary, etc.)
              const base = current.replace(/-.*$/, '');

              // Create canary version with commit SHA
              console.log(\`\${base}-canary.\${sha}\`);
            "
          }

          # Publish design-system canary if changed
          if [ "${{ steps.changes.outputs.design_system_changed }}" = "true" ]; then
            echo "📦 Publishing @kubit-ui-web/design-system canary..."
            cd packages/design-system
            CURRENT=$(node -p "require('./package.json').version")
            NEW=$(calc_canary_version "$CURRENT" "$SHORT_SHA")

            echo "  $CURRENT → $NEW"
            npm version $NEW --no-git-tag-version
            pnpm publish --no-git-checks --access public --tag canary --provenance

            PUBLISHED="$PUBLISHED\n- @kubit-ui-web/design-system@$NEW"
            echo "design_system_version=$NEW" >> $GITHUB_OUTPUT
            HAS_PUBLISHED=true
            cd ../..
          else
            echo "⏭️  Skipping design-system (no changes)"
          fi

          # Publish components canary if changed
          if [ "${{ steps.changes.outputs.components_changed }}" = "true" ]; then
            echo "📦 Publishing @kubit-ui-web/react-components canary..."
            cd packages/components
            CURRENT=$(node -p "require('./package.json').version")
            NEW=$(calc_canary_version "$CURRENT" "$SHORT_SHA")

            echo "  $CURRENT → $NEW"
            npm version $NEW --no-git-tag-version
            pnpm publish --no-git-checks --access public --tag canary --provenance

            PUBLISHED="$PUBLISHED\n- @kubit-ui-web/react-components@$NEW"
            echo "components_version=$NEW" >> $GITHUB_OUTPUT
            HAS_PUBLISHED=true
            cd ../..
          else
            echo "⏭️  Skipping react-components (no changes)"
          fi

          echo "published=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "has_published=$HAS_PUBLISHED" >> $GITHUB_OUTPUT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Reset package.json versions
        if: steps.canary-publish.outputs.has_published == 'true'
        run: |
          # Reset package.json to avoid committing canary versions
          git checkout -- packages/*/package.json pnpm-lock.yaml

      - name: Create comment on commit
        if: steps.canary-publish.outputs.has_published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const packages = '${{ steps.canary-publish.outputs.published }}';
            const sha = context.sha;
            const branch = '${{ github.ref_name }}';

            const comment = `## 🐤 Canary Release Published!

            **Branch:** \`${branch}\`
            **Commit:** \`${sha.substring(0, 7)}\`

            ### 📦 Published Packages
            ${packages}

            ### 📥 Installation
            \`\`\`bash
            # Install canary versions
            npm install @kubit-ui-web/react-components@canary
            npm install @kubit-ui-web/design-system@canary

            # Or install specific versions
            npm install @kubit-ui-web/react-components@${{ steps.canary-publish.outputs.components_version }}
            npm install @kubit-ui-web/design-system@${{ steps.canary-publish.outputs.design_system_version }}
            \`\`\`

            ### ⚠️ Canary Notice
            This is a **canary release** for testing purposes. It represents the latest code from \`${branch}\` and may be unstable.

            ### ✅ Quality Checks
            - Linting passed
            - Type checking passed
            - Tests passed
            - Builds successful
            - Published with provenance 🔒`;

            // Try to find existing commits API (not available in all contexts)
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
                body: comment
              });
            } catch (error) {
              console.log('Could not create commit comment:', error.message);
            }

      - name: Success Summary
        if: steps.canary-publish.outputs.has_published == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🐤 CANARY RELEASE SUCCESSFUL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📦 Published Packages:"
          if [ "${{ steps.changes.outputs.design_system_changed }}" = "true" ]; then
            echo "  - @kubit-ui-web/design-system@${{ steps.canary-publish.outputs.design_system_version }}"
          fi
          if [ "${{ steps.changes.outputs.components_changed }}" = "true" ]; then
            echo "  - @kubit-ui-web/react-components@${{ steps.canary-publish.outputs.components_version }}"
          fi
          echo ""
          echo "🔖 Tag: canary"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📝 Commit: $(git rev-parse --short HEAD)"
          echo "🔒 Provenance: Enabled"
          echo "⚡ Built with Turbo cache"
          echo ""
          echo "💡 Install with: npm install @kubit-ui-web/react-components@canary"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: No changes summary
        if: steps.changes.outputs.should_publish == 'false'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏭️  NO CHANGES DETECTED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "No changes detected in publishable packages."
          echo "Skipping canary release."
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Failure notification
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ CANARY RELEASE FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🔍 Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "🔧 Common issues:"
          echo "  • NPM_TOKEN not configured or invalid"
          echo "  • Version already exists in NPM"
          echo "  • Tests or build failures"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
