name: Auto Publish to NPM (Monorepo)

# This workflow publishes packages from the monorepo to NPM
# It can publish individual packages or all packages based on the PR title
#
# PR Title Tags:
# - [components] or components: - Publish only @kubit-ui-web/react-components
# - [design-system] or design-system: - Publish only @kubit-ui-web/design-system
# - [all] or [monorepo] - Publish all packages
# - No tag - Publish all packages (default)
#
# Required secrets:
# 1. NPM_TOKEN: NPM automation token for publishing packages
# 2. RELEASE_TOKEN: GitHub PAT with bypass permissions
# 3. CHROMATIC_PROJECT_TOKEN_COMPONENTS: Chromatic token for Storybook

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: read
  id-token: write # Required for NPM provenance

jobs:
  auto-publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Detect changed packages
        id: changes
        run: |
          echo "Detecting changes in packages compared to PR base..."

          # Get the base branch from the PR (usually main)
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "Base branch: $BASE_BRANCH"

          # Fetch base branch for comparison
          git fetch origin $BASE_BRANCH
          BASE_REF="origin/$BASE_BRANCH"

          # Get PR info
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "Branch: $BRANCH_NAME"
          echo "PR Title: $PR_TITLE"

          # Check for changes in each package
          DESIGN_SYSTEM_CHANGED=false
          COMPONENTS_CHANGED=false

          if git diff --name-only HEAD $BASE_REF | grep -q "^packages/design-system/"; then
            DESIGN_SYSTEM_CHANGED=true
            echo "✅ Changes detected in design-system"
          else
            echo "⏭️  No changes in design-system"
          fi

          if git diff --name-only HEAD $BASE_REF | grep -q "^packages/components/"; then
            COMPONENTS_CHANGED=true
            echo "✅ Changes detected in react-components"
          else
            echo "⏭️  No changes in react-components"
          fi

          # Determine publish strategy
          PUBLISH_COMPONENTS=false
          PUBLISH_DESIGN_SYSTEM=false

          # Check PR title for explicit package selection
          if [[ "$PR_TITLE" =~ \[components\] ]] || [[ "$PR_TITLE" =~ ^components: ]]; then
            PUBLISH_COMPONENTS=$COMPONENTS_CHANGED
            echo "📦 Publishing: components only (if changed)"
          elif [[ "$PR_TITLE" =~ \[design-system\] ]] || [[ "$PR_TITLE" =~ ^design-system: ]]; then
            PUBLISH_DESIGN_SYSTEM=$DESIGN_SYSTEM_CHANGED
            echo "📦 Publishing: design-system only (if changed)"
          else
            # Default: publish packages that have changes
            PUBLISH_COMPONENTS=$COMPONENTS_CHANGED
            PUBLISH_DESIGN_SYSTEM=$DESIGN_SYSTEM_CHANGED
            echo "📦 Publishing: packages with changes"
          fi

          # Validate branch pattern
          if [[ ! "$BRANCH_NAME" =~ ^(feat|feature|fix|bugfix|break|breaking|hotfix|chore)/[a-zA-Z0-9._/-]+$ ]]; then
            echo "⚠️  Branch doesn't match release patterns, but continuing..."
          fi

          # Determine if we should publish anything
          SHOULD_PUBLISH=false
          if [ "$PUBLISH_COMPONENTS" = "true" ] || [ "$PUBLISH_DESIGN_SYSTEM" = "true" ]; then
            SHOULD_PUBLISH=true
          fi

          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "publish_components=$PUBLISH_COMPONENTS" >> "$GITHUB_OUTPUT"
          echo "publish_design_system=$PUBLISH_DESIGN_SYSTEM" >> "$GITHUB_OUTPUT"
          echo "design_system_changed=$DESIGN_SYSTEM_CHANGED" >> "$GITHUB_OUTPUT"
          echo "components_changed=$COMPONENTS_CHANGED" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_PUBLISH" = "false" ]; then
            echo "⏭️  No changes detected in publishable packages, skipping publish"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          echo "Installing monorepo dependencies..."
          pnpm install --frozen-lockfile

      - name: Run quality checks
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          echo "Running quality checks with Turbo..."
          pnpm lint --filter=@kubit-ui-web/react-components --filter=@kubit-ui-web/design-system
          pnpm typecheck --filter=@kubit-ui-web/react-components --filter=@kubit-ui-web/design-system

      - name: Run tests
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          echo "Running tests with Turbo..."
          pnpm test

      - name: Build packages
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          echo "Building packages with Turbo..."
          pnpm build

      - name: Build and publish Storybook
        if: steps.changes.outputs.should_publish == 'true'
        continue-on-error: true
        run: |
          echo "Building Storybook with Turbo..."
          pnpm build:storybook

          echo "Publishing to Chromatic..."
          pnpm --filter @kubit-ui-web/storybook chromatic --exit-zero-on-changes --auto-accept-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN_COMPONENTS }}

      - name: Configure Git
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          git config --local user.email "kubit-bot@github.com"
          git config --local user.name "Kubit Release Bot"

      - name: Determine version bump per package
        if: steps.changes.outputs.should_publish == 'true'
        id: version-bump
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"

          # Fetch base branch for comparison
          git fetch origin $BASE_BRANCH
          BASE_REF="origin/$BASE_BRANCH"

          # Function to determine version bump for a package based on its commits
          determine_package_version() {
            local package_path=$1
            local package_name=$2

            echo "🔍 Analyzing commits for $package_name..."

            # Get commits that affected this package
            local commits=$(git log --oneline HEAD...$BASE_REF --reverse -- "$package_path")

            # Check for breaking changes
            if echo "$commits" | grep -qE "(BREAKING CHANGE|!:)" || \
               echo "$PR_TITLE" | grep -q "!" || \
               echo "$PR_TITLE" | grep -qi "\[breaking\]" || \
               [[ $BRANCH_NAME =~ ^break/ ]] || \
               [[ $BRANCH_NAME =~ ^breaking/ ]]; then
              echo "major"
              return
            fi

            # Check for features (minor)
            if echo "$commits" | grep -qE "^[a-f0-9]+ (feat|feature)(\(.+\))?:" || \
               echo "$PR_TITLE" | grep -Eq "^(feat|feature)(\($package_name\))?:" || \
               [[ $BRANCH_NAME =~ ^feat/ ]] || \
               [[ $BRANCH_NAME =~ ^feature/ ]]; then
              echo "minor"
              return
            fi

            # Default to patch
            echo "patch"
          }

          # Determine version for design-system
          if [[ "${{ steps.changes.outputs.design_system_changed }}" == "true" ]]; then
            DESIGN_SYSTEM_VERSION_TYPE=$(determine_package_version "packages/design-system" "design-system")
            echo "design_system_version_type=$DESIGN_SYSTEM_VERSION_TYPE" >> $GITHUB_OUTPUT
            echo "📦 design-system: $DESIGN_SYSTEM_VERSION_TYPE"
          fi

          # Determine version for components
          if [[ "${{ steps.changes.outputs.components_changed }}" == "true" ]]; then
            COMPONENTS_VERSION_TYPE=$(determine_package_version "packages/components" "components")
            echo "components_version_type=$COMPONENTS_VERSION_TYPE" >> $GITHUB_OUTPUT
            echo "📦 react-components: $COMPONENTS_VERSION_TYPE"
          fi

          # Keep backward compatibility - use the highest version type for global reference
          if [[ "$DESIGN_SYSTEM_VERSION_TYPE" == "major" ]] || [[ "$COMPONENTS_VERSION_TYPE" == "major" ]]; then
            VERSION_TYPE="major"
          elif [[ "$DESIGN_SYSTEM_VERSION_TYPE" == "minor" ]] || [[ "$COMPONENTS_VERSION_TYPE" == "minor" ]]; then
            VERSION_TYPE="minor"
          else
            VERSION_TYPE="patch"
          fi

          echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT
          echo "reason=Per-package versioning" >> $GITHUB_OUTPUT

      - name: Verify NPM authentication
        if: steps.changes.outputs.should_publish == 'true'
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "❌ NPM_TOKEN not configured"
            exit 1
          fi

          echo "✅ Testing NPM authentication..."
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages to NPM
        if: steps.changes.outputs.should_publish == 'true'
        id: npm-publish
        run: |
          PUBLISHED_PACKAGES=""
          HAS_PUBLISHED=false

          # Function to calculate stable version from beta
          calc_stable_version() {
            local current=$1
            local version_type=$2
            node -e "
              const current = '$current';
              const versionType = '$version_type';

              // Check if current version is a beta
              const betaMatch = current.match(/^(\d+)\.(\d+)\.(\d+)-beta\.\d+$/);

              if (betaMatch) {
                // Remove beta suffix and use the base version
                const major = parseInt(betaMatch[1]);
                const minor = parseInt(betaMatch[2]);
                const patch = parseInt(betaMatch[3]);

                // For breaking changes from break/ branches, the version is already correct
                // Just remove the beta suffix
                if (versionType === 'major') {
                  console.log(\`\${major}.\${minor}.\${patch}\`);
                } else if (versionType === 'minor') {
                  console.log(\`\${major}.\${minor}.\${patch}\`);
                } else {
                  console.log(\`\${major}.\${minor}.\${patch}\`);
                }
              } else {
                // Not a beta version, use standard semver bump
                const parts = current.split('.').map(Number);
                if (versionType === 'major') {
                  parts[0]++;
                  parts[1] = 0;
                  parts[2] = 0;
                } else if (versionType === 'minor') {
                  parts[1]++;
                  parts[2] = 0;
                } else {
                  parts[2]++;
                }
                console.log(parts.join('.'));
              }
            "
          }

          # Publish design-system first (no dependencies) if changed
          if [[ "${{ steps.changes.outputs.publish_design_system }}" == "true" ]]; then
            DESIGN_SYSTEM_VERSION_TYPE="${{ steps.version-bump.outputs.design_system_version_type }}"
            echo "📦 Publishing @kubit-ui-web/design-system (bump: $DESIGN_SYSTEM_VERSION_TYPE)..."
            cd packages/design-system

            CURRENT=$(node -p "require('./package.json').version")
            NEW=$(calc_stable_version "$CURRENT" "$DESIGN_SYSTEM_VERSION_TYPE")

            echo "  Version: $CURRENT → $NEW ($DESIGN_SYSTEM_VERSION_TYPE)"
            npm version $NEW --no-git-tag-version
            pnpm publish --no-git-checks --access public --provenance

            PUBLISHED_PACKAGES="$PUBLISHED_PACKAGES @kubit-ui-web/design-system@$NEW"
            echo "design_system_version=$NEW" >> $GITHUB_OUTPUT
            HAS_PUBLISHED=true
            cd ../..
          else
            echo "⏭️  Skipping design-system (no changes)"
          fi

          # Publish components if changed
          if [[ "${{ steps.changes.outputs.publish_components }}" == "true" ]]; then
            COMPONENTS_VERSION_TYPE="${{ steps.version-bump.outputs.components_version_type }}"
            echo "📦 Publishing @kubit-ui-web/react-components (bump: $COMPONENTS_VERSION_TYPE)..."
            cd packages/components

            CURRENT=$(node -p "require('./package.json').version")
            NEW=$(calc_stable_version "$CURRENT" "$COMPONENTS_VERSION_TYPE")

            echo "  Version: $CURRENT → $NEW ($COMPONENTS_VERSION_TYPE)"
            npm version $NEW --no-git-tag-version
            pnpm publish --no-git-checks --access public --provenance

            PUBLISHED_PACKAGES="$PUBLISHED_PACKAGES @kubit-ui-web/react-components@$NEW"
            echo "components_version=$NEW" >> $GITHUB_OUTPUT
            HAS_PUBLISHED=true
            cd ../..
          else
            echo "⏭️  Skipping react-components (no changes)"
          fi

          echo "published=$HAS_PUBLISHED" >> $GITHUB_OUTPUT
          echo "packages=$PUBLISHED_PACKAGES" >> $GITHUB_OUTPUT
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bumps
        if: steps.npm-publish.outputs.published == 'true'
        run: |
          git add packages/*/package.json pnpm-lock.yaml
          git commit -m "chore(release): bump package versions [skip ci]" || echo "No changes"
          git push origin HEAD:${{ github.event.pull_request.base.ref }}

      - name: Create GitHub Release
        if: steps.npm-publish.outputs.published == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.npm-publish.outputs.components_version || steps.npm-publish.outputs.design_system_version }}
          name: Release ${{ steps.npm-publish.outputs.components_version || steps.npm-publish.outputs.design_system_version }}
          body: |
            ## 🚀 Release

            **Branch:** `${{ steps.changes.outputs.branch_name }}`

            ### 📦 Published Packages
            ${{ steps.npm-publish.outputs.packages }}

            ### 📊 Version Bumps
            - Design System: ${{ steps.changes.outputs.design_system_changed == 'true' && format('✅ {0}', steps.version-bump.outputs.design_system_version_type) || '⏭️ No changes' }}
            - React Components: ${{ steps.changes.outputs.components_changed == 'true' && format('✅ {0}', steps.version-bump.outputs.components_version_type) || '⏭️ No changes' }}

            ### 📝 Changes
            - ${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})

            ### 🔗 Links
            - [Components NPM](https://www.npmjs.com/package/@kubit-ui-web/react-components)
            - [Design System NPM](https://www.npmjs.com/package/@kubit-ui-web/design-system)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Success notification
        if: steps.npm-publish.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const packages = '${{ steps.npm-publish.outputs.packages }}';
            const versionType = '${{ steps.version-bump.outputs.version_type }}';
            const emoji = versionType === 'major' ? '💥' : versionType === 'minor' ? '✨' : '🐛';

            const comment = `## ${emoji} Auto-publish Successful!

            ### 📦 Published Packages
            ${packages}

            ### ✅ Completed
            - Quality checks passed
            - Tests passed
            - Builds successful (with Turbo cache ⚡)
            - Published to NPM with provenance 🔒
            - GitHub release created

            🎉 **Ready to use!**`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: No changes notification
        if: steps.changes.outputs.should_publish == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ⏭️ No Changes Detected

            No changes were detected in publishable packages compared to \`main\`.

            ### 📊 Change Detection
            - **Design System**: No changes
            - **React Components**: No changes

            Skipping publish. If you expected a publish, ensure your changes are in the correct package directories.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
