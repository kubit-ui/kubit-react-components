name: Release Beta with Changesets (Monorepo)

# This workflow publishes beta versions on push to break/* branches
# Beta versions follow the pattern: X.Y.Z-beta.N (e.g., 2.0.0-beta.48)
# Uses Changesets for version management with automatic package detection
#
# Required secrets:
# 1. NPM_TOKEN: NPM automation token for publishing packages
# 2. RELEASE_TOKEN: GitHub PAT with bypass permissions

on:
  push:
    branches:
      - 'break/**'

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: read
  id-token: write # Required for NPM provenance

jobs:
  release-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: |
          echo "Installing dependencies with pnpm..."
          pnpm --version
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Detect affected packages from branch
        id: detect
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch: $BRANCH_NAME"

          # Extract scope from branch name if present (e.g., break/components/feature)
          PACKAGES=""

          if [[ "$BRANCH_NAME" =~ break/components ]]; then
            PACKAGES="@kubit-ui-web/react-components"
          elif [[ "$BRANCH_NAME" =~ break/design-system ]]; then
            PACKAGES="@kubit-ui-web/design-system"
          elif [[ "$BRANCH_NAME" =~ break/(all|monorepo) ]]; then
            PACKAGES="@kubit-ui-web/react-components @kubit-ui-web/design-system"
          else
            # Detect from file changes in last commit
            COMPONENTS_CHANGED=false
            DESIGN_SYSTEM_CHANGED=false

            if git diff --name-only HEAD~1 HEAD | grep -q "^packages/components/"; then
              COMPONENTS_CHANGED=true
            fi

            if git diff --name-only HEAD~1 HEAD | grep -q "^packages/design-system/"; then
              DESIGN_SYSTEM_CHANGED=true
            fi

            if [ "$COMPONENTS_CHANGED" = true ] && [ "$DESIGN_SYSTEM_CHANGED" = true ]; then
              PACKAGES="@kubit-ui-web/react-components @kubit-ui-web/design-system"
            elif [ "$COMPONENTS_CHANGED" = true ]; then
              PACKAGES="@kubit-ui-web/react-components"
            elif [ "$DESIGN_SYSTEM_CHANGED" = true ]; then
              PACKAGES="@kubit-ui-web/design-system"
            fi
          fi

          if [ -z "$PACKAGES" ]; then
            echo "⚠️ No packages detected, defaulting to all packages"
            PACKAGES="@kubit-ui-web/react-components @kubit-ui-web/design-system"
          fi

          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          echo "📦 Packages to release: $PACKAGES"

      - name: Get latest commit message
        id: commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "Commit message: $COMMIT_MSG"

      - name: Create beta changeset
        run: |
          PACKAGES="${{ steps.detect.outputs.packages }}"
          COMMIT_MSG="${{ steps.commit.outputs.message }}"

          # Clean commit message for changeset summary
          SUMMARY=$(echo "$COMMIT_MSG" | sed -E 's/^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|break|breaking)(\([^)]+\))?!?:\s*//')

          # Create changeset file
          CHANGESET_ID=$(date +%s)
          CHANGESET_FILE=".changeset/beta-$CHANGESET_ID.md"

          echo "---" > $CHANGESET_FILE
          for PKG in $PACKAGES; do
            echo "\"$PKG\": major" >> $CHANGESET_FILE
          done
          echo "---" >> $CHANGESET_FILE
          echo "" >> $CHANGESET_FILE
          echo "$SUMMARY" >> $CHANGESET_FILE

          echo "✅ Created beta changeset:"
          cat $CHANGESET_FILE

      - name: Enter prerelease mode
        run: |
          echo "📦 Entering beta prerelease mode..."
          pnpm changeset pre enter beta

      - name: Version packages
        run: |
          echo "📦 Versioning packages for beta..."
          pnpm changeset:version

          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Commit version changes
          git add .
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: version packages for beta [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

      - name: Build packages
        run: |
          echo "🏗️ Building packages..."
          pnpm build
        env:
          NODE_ENV: production

      - name: Publish beta to NPM
        run: |
          echo "🚀 Publishing beta to NPM..."
          pnpm changeset:publish --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Exit prerelease mode
        run: |
          echo "📦 Exiting beta prerelease mode..."
          pnpm changeset pre exit

          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: exit beta prerelease mode [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

      - name: Get published versions
        id: versions
        run: |
          PACKAGES="${{ steps.detect.outputs.packages }}"
          VERSIONS=""

          for PKG in $PACKAGES; do
            if [[ "$PKG" == *"react-components"* ]]; then
              PKG_DIR="packages/components"
            elif [[ "$PKG" == *"design-system"* ]]; then
              PKG_DIR="packages/design-system"
            fi

            VERSION=$(node -p "require('./$PKG_DIR/package.json').version")
            VERSIONS="$VERSIONS\n- $PKG@$VERSION"
          done

          echo "versions<<EOF" >> $GITHUB_OUTPUT
          echo -e "$VERSIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const versions = `${{ steps.versions.outputs.versions }}`;
            const packages = '${{ steps.detect.outputs.packages }}'.split(' ');

            let comment = '## 🚀 Beta Packages Published\n\n';
            comment += '**Branch:** `${{ github.ref_name }}`\n\n';
            comment += '| Package | Version | NPM Link |\n';
            comment += '|---------|---------|----------|\n';

            for (const pkg of packages) {
              const pkgDir = pkg.includes('react-components')
                ? 'packages/components'
                : 'packages/design-system';
              const pkgName = pkg.includes('react-components')
                ? 'react-components'
                : 'design-system';

              const fs = require('fs');
              const packageJson = JSON.parse(fs.readFileSync(`${pkgDir}/package.json`, 'utf8'));
              const version = packageJson.version;
              const npmLink = `https://www.npmjs.com/package/${pkg}/v/${version}`;

              comment += `| ${pkgName} | \`${version}\` | [View on NPM](${npmLink}) |\n`;
            }

            comment += '\n✅ Beta packages have been successfully published to NPM!\n\n';
            comment += '**Install beta version:**\n';
            comment += '```sh\n';
            for (const pkg of packages) {
              const pkgDir = pkg.includes('react-components')
                ? 'packages/components'
                : 'packages/design-system';
              const packageJson = JSON.parse(require('fs').readFileSync(`${pkgDir}/package.json`, 'utf8'));
              const version = packageJson.version;
              comment += `pnpm add ${pkg}@${version}\n`;
            }
            comment += '```';

            // Try to find an open PR for this branch
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${{ github.ref_name }}`,
              state: 'open'
            });

            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                issue_number: prs.data[0].number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
