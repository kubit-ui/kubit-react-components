name: Release Production with Changesets (Monorepo)

# This workflow publishes production releases when PRs are merged to main
# It uses Changesets to manage versioning and publishing for the monorepo
# It automatically detects which packages changed based on commit scopes:
# - feat(components): ... → publishes @kubit-ui-web/react-components
# - fix(design-system): ... → publishes @kubit-ui-web/design-system
# - feat(all): ... → publishes all packages
#
# Required secrets:
# 1. NPM_TOKEN: NPM automation token for publishing packages
# 2. RELEASE_TOKEN: GitHub PAT with bypass permissions

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: read
  id-token: write # Required for NPM provenance

jobs:
  auto-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: |
          echo "Installing dependencies with pnpm..."
          pnpm --version
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Detect version bump type and affected packages from commits
        id: detect
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"

          echo "📝 Analyzing commits in this PR..."

          # Get all commit messages in the PR
          COMMITS=$(git log --pretty=format:"%s" $BASE_REF..HEAD)
          echo "Commits:"
          echo "$COMMITS"
          echo ""

          # Detect version bump type from commits
          BUMP_TYPE="patch"
          HAS_FEAT=false
          HAS_BREAKING=false

          while IFS= read -r commit; do
            if [[ "$commit" =~ ^(break|breaking|feat!) ]] || [[ "$commit" =~ BREAKING\ CHANGE ]]; then
              HAS_BREAKING=true
            elif [[ "$commit" =~ ^feat ]]; then
              HAS_FEAT=true
            fi
          done <<< "$COMMITS"

          if [ "$HAS_BREAKING" = true ]; then
            BUMP_TYPE="major"
          elif [ "$HAS_FEAT" = true ]; then
            BUMP_TYPE="minor"
          fi

          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "📦 Version bump type: $BUMP_TYPE"

          # Detect affected packages from commit scopes
          COMPONENTS_AFFECTED=false
          DESIGN_SYSTEM_AFFECTED=false
          STORYBOOK_AFFECTED=false
          ALL_AFFECTED=false

          while IFS= read -r commit; do
            # Extract scope from commit message: type(scope): message
            # Match pattern like "feat(scope):" but not "(#123)"
            if [[ "$commit" =~ ^[a-z]+\(([^)]+)\): ]]; then
              SCOPE="${BASH_REMATCH[1]}"
              echo "Found scope in commit: $SCOPE"

              case "$SCOPE" in
                components)
                  COMPONENTS_AFFECTED=true
                  ;;
                design-system)
                  DESIGN_SYSTEM_AFFECTED=true
                  ;;
                storybook)
                  STORYBOOK_AFFECTED=true
                  ;;
                all|monorepo)
                  ALL_AFFECTED=true
                  ;;
              esac
            fi
          done <<< "$COMMITS"

          # Build packages list
          PACKAGES=""

          if [ "$ALL_AFFECTED" = true ]; then
            PACKAGES="@kubit-ui-web/react-components @kubit-ui-web/design-system"
            echo "📦 Scope 'all' detected - publishing all packages"
          else
            if [ "$COMPONENTS_AFFECTED" = true ]; then
              PACKAGES="$PACKAGES @kubit-ui-web/react-components"
            fi
            if [ "$DESIGN_SYSTEM_AFFECTED" = true ]; then
              PACKAGES="$PACKAGES @kubit-ui-web/design-system"
            fi
            # Note: storybook is private and won't be published
          fi

          # If no scopes found, detect from file changes
          if [ -z "$PACKAGES" ]; then
            echo "⚠️ No scopes found in commits, detecting from file changes..."

            COMPONENTS_CHANGED=false
            DESIGN_SYSTEM_CHANGED=false

            if git diff --name-only HEAD $BASE_REF | grep -q "^packages/components/"; then
              COMPONENTS_CHANGED=true
            fi

            if git diff --name-only HEAD $BASE_REF | grep -q "^packages/design-system/"; then
              DESIGN_SYSTEM_CHANGED=true
            fi

            if [ "$COMPONENTS_CHANGED" = true ] && [ "$DESIGN_SYSTEM_CHANGED" = true ]; then
              PACKAGES="@kubit-ui-web/react-components @kubit-ui-web/design-system"
            elif [ "$COMPONENTS_CHANGED" = true ]; then
              PACKAGES="@kubit-ui-web/react-components"
            elif [ "$DESIGN_SYSTEM_CHANGED" = true ]; then
              PACKAGES="@kubit-ui-web/design-system"
            fi
          fi

          # Trim leading/trailing spaces
          PACKAGES=$(echo "$PACKAGES" | xargs)

          if [ -z "$PACKAGES" ]; then
            echo "⚠️ No packages detected for release"
            echo "packages=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          echo "📦 Packages to release: $PACKAGES"

      - name: Create changeset
        if: steps.detect.outputs.packages != ''
        run: |
          BUMP_TYPE="${{ steps.detect.outputs.bump_type }}"
          PACKAGES="${{ steps.detect.outputs.packages }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Clean PR title for changeset summary
          SUMMARY=$(echo "$PR_TITLE" | sed -E 's/^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|break|breaking)(\([^)]+\))?!?:\s*//')

          # Create changeset file
          CHANGESET_ID=$(date +%s)
          CHANGESET_FILE=".changeset/auto-$CHANGESET_ID.md"

          echo "---" > $CHANGESET_FILE
          for PKG in $PACKAGES; do
            echo "\"$PKG\": $BUMP_TYPE" >> $CHANGESET_FILE
          done
          echo "---" >> $CHANGESET_FILE
          echo "" >> $CHANGESET_FILE
          echo "$SUMMARY" >> $CHANGESET_FILE
          echo "" >> $CHANGESET_FILE
          echo "PR: #$PR_NUMBER" >> $CHANGESET_FILE

          echo "✅ Created changeset:"
          cat $CHANGESET_FILE

      - name: Update version and changelog
        if: steps.detect.outputs.packages != ''
        run: |
          echo "📦 Updating version and changelog..."
          pnpm changeset:version

          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Commit version changes
          git add .
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: version packages [skip ci]"
            git push origin main
          fi

      - name: Build packages
        if: steps.detect.outputs.packages != ''
        run: |
          echo "🏗️ Building packages..."
          pnpm build
        env:
          NODE_ENV: production

      - name: Publish to NPM
        if: steps.detect.outputs.packages != ''
        run: |
          echo "🚀 Publishing to NPM..."
          pnpm changeset:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Releases
        if: steps.detect.outputs.packages != ''
        run: |
          PACKAGES="${{ steps.detect.outputs.packages }}"

          for PKG in $PACKAGES; do
            # Get package directory
            if [[ "$PKG" == *"react-components"* ]]; then
              PKG_DIR="packages/components"
              PKG_NAME="react-components"
            elif [[ "$PKG" == *"design-system"* ]]; then
              PKG_DIR="packages/design-system"
              PKG_NAME="design-system"
            fi

            # Get version from package.json
            VERSION=$(node -p "require('./$PKG_DIR/package.json').version")
            TAG="$PKG_NAME@$VERSION"

            # Extract changelog for this version
            CHANGELOG=$(awk "/^## $VERSION/,/^## /" $PKG_DIR/CHANGELOG.md | sed '1d;$d')

            # Create release
            gh release create "$TAG" \
              --title "$PKG_NAME v$VERSION" \
              --notes "$CHANGELOG" \
              --target main
          done
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: steps.detect.outputs.packages != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const packages = '${{ steps.detect.outputs.packages }}'.split(' ');
            const bumpType = '${{ steps.detect.outputs.bump_type }}';

            let comment = '## 🚀 Packages Published\n\n';
            comment += `**Version bump type:** \`${bumpType}\`\n\n`;
            comment += '| Package | Version | NPM Link |\n';
            comment += '|---------|---------|----------|\n';

            for (const pkg of packages) {
              const pkgDir = pkg.includes('react-components')
                ? 'packages/components'
                : 'packages/design-system';
              const pkgName = pkg.includes('react-components')
                ? 'react-components'
                : 'design-system';

              const fs = require('fs');
              const packageJson = JSON.parse(fs.readFileSync(`${pkgDir}/package.json`, 'utf8'));
              const version = packageJson.version;
              const npmLink = `https://www.npmjs.com/package/${pkg}/v/${version}`;

              comment += `| ${pkgName} | \`${version}\` | [View on NPM](${npmLink}) |\n`;
            }

            comment += '\n✅ All packages have been successfully published to NPM!';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
